<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subestações da Bahia — BDGD Coelba 2024</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#12171f; --bg2:#1a212c; --line:#2b3543; --txt:#e8edf4; --dim:#9aa8bb;
    --accent:#7fd1ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100%;overflow:hidden}
  /* ---------- painel lateral ---------- */
  #painel{width:352px;min-width:352px;height:100%;background:var(--bg);color:var(--txt);
    display:flex;flex-direction:column;border-right:1px solid var(--line)}
  #painel header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  #painel h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
  #painel .sub{margin-top:4px;font-size:11.5px;color:var(--dim);line-height:1.45}
  .rolagem{overflow-y:auto;flex:1;padding:14px 18px 24px;scrollbar-width:thin}
  .rolagem::-webkit-scrollbar{width:8px}
  .rolagem::-webkit-scrollbar-thumb{background:#33404f;border-radius:4px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);
    margin:20px 0 8px;font-weight:700}
  h2:first-child{margin-top:0}
  #busca,#filtroMun{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);
    background:var(--bg2);color:var(--txt);font-size:13px}
  #busca::placeholder{color:#6b7887}
  #filtroMun{cursor:pointer}
  #filtroMun option{background:var(--bg2);color:var(--txt)}
  /* ---------- indicadores ---------- */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .kpi b{display:block;font-size:16px;font-weight:650;letter-spacing:-.2px}
  .kpi span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  /* ---------- legenda / filtros ---------- */
  .tipo{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;cursor:pointer;
    user-select:none;font-size:12.5px;line-height:1.25}
  .tipo:hover{background:#1e2733}
  .tipo.off{opacity:.38}
  .tipo svg{flex:0 0 20px}
  .tipo .qtd{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim);font-size:11.5px}
  .opcao{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
    padding:4px 6px;cursor:pointer}
  .opcao input{accent-color:#4aa3d8}
  /* ---------- lista ---------- */
  #lista{display:flex;flex-direction:column;gap:2px}
  .item{display:flex;gap:8px;align-items:center;padding:6px 7px;border-radius:6px;cursor:pointer;
    font-size:12px;border:1px solid transparent}
  .item:hover{background:#1e2733;border-color:var(--line)}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .vl{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px}
  .nota{font-size:10.5px;color:#7d8a9b;line-height:1.5;margin-top:10px;
    border-top:1px dashed var(--line);padding-top:10px}
  /* ---------- mapa ---------- */
  #mapa{flex:1;height:100%;background:#dfe3e8}
  .marcador{display:block}
  .marcador svg{overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
  .marcador.destaque svg{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 3px #000)}
  .rotulo{font-size:10.5px;font-weight:600;color:#1a2431;white-space:nowrap;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;pointer-events:none}
  /* ---------- tooltip ---------- */
  .leaflet-tooltip.card{background:#fff;border:1px solid #b9c2cd;border-radius:9px;
    box-shadow:0 8px 26px rgba(9,17,28,.28);padding:0;max-width:340px;white-space:normal;
    color:#16202c;font-size:11.5px;line-height:1.4}
  /* cartao do hover: coluna unica e largura fixa, para nada transbordar */
  .card.enxuto{width:326px}
  .leaflet-tooltip.card:before{display:none}
  .cab{padding:9px 12px 8px;border-bottom:1px solid #e4e8ee;display:flex;gap:8px;align-items:flex-start}
  .cab .nome{font-size:13.5px;font-weight:700;line-height:1.2}
  .cab .cod{font-size:10.5px;color:#66748a;font-family:"Cascadia Mono",Consolas,monospace}
  .badge{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:5px;
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
    padding:3px 7px;border-radius:20px;border:1.5px solid;white-space:nowrap}
  .corpo{padding:8px 12px 11px}
  .sec{margin-top:9px}
  .sec:first-child{margin-top:0}
  .sec>.tit{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
    color:#7b8798;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .sec>.tit:after{content:"";flex:1;height:1px;background:#e7ebf1}
  .grid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 8px;align-items:baseline}
  .grid.simples{grid-template-columns:auto 1fr}
  .grid .k{color:#6c7a8d;font-size:10.5px;white-space:nowrap}
  .grid .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;
    min-width:0;overflow-wrap:anywhere}
  .larga{grid-column:2/5}
  .grid.simples .larga{grid-column:2/3}
  .tab{width:100%;border-collapse:collapse;margin-top:3px;font-size:10.5px}
  .tab th{text-align:left;color:#6c7a8d;font-weight:600;border-bottom:1px solid #e7ebf1;padding:1px 4px}
  .tab td{padding:1px 4px;border-bottom:1px solid #f2f5f8;font-variant-numeric:tabular-nums}
  .tab td.n{text-align:right}
  .mix{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:4px 0 3px;background:#eef1f5}
  .mix i{display:block;height:100%}
  .mixleg{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:10px;color:#4d5a6b}
  .mixleg span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;
    margin-right:4px;background:var(--c)}
  .vazio{color:#8b97a8;font-style:italic;font-size:10.5px}
  .rodape{padding:6px 12px 8px;border-top:1px solid #e4e8ee;color:#8492a4;font-size:9.5px}
  /* ---------- detalhe no painel ---------- */
  #detalhe .card{background:#fff;border-radius:8px;color:#16202c}
  #detalhe{margin-top:6px}
  /* o painel e estreito: a ficha completa usa uma coluna de rotulo/valor */
  #detalhe .grid{grid-template-columns:auto 1fr}
  #detalhe .larga{grid-column:2/3}
  #fechar{float:right;cursor:pointer;color:var(--dim);font-size:11px}
  @media (max-width:820px){
    #app{flex-direction:column}
    #painel{width:100%;min-width:0;height:46%;border-right:0;border-bottom:1px solid var(--line)}
    #mapa{height:54%}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="painel">
    <header>
      <h1>Subestações da Bahia</h1>
      <div class="sub" id="cabecalho"></div>
    </header>
    <div class="rolagem">
      <h2>Resumo do filtro</h2>
      <div class="kpis" id="kpis"></div>

      <h2>Tipo de subestação (posse)</h2>
      <div id="legenda"></div>
      <div class="opcao"><label><input type="checkbox" id="opt-tamanho" checked>
        Tamanho do símbolo ∝ potência instalada</label></div>
      <div class="opcao"><label><input type="checkbox" id="opt-rotulo">
        Mostrar nome das subestações no mapa</label></div>

      <h2>Município</h2>
      <select id="filtroMun"></select>

      <h2>Buscar</h2>
      <input id="busca" placeholder="nome, código, município ou conjunto…" autocomplete="off">

      <h2 id="tituloLista">Subestações</h2>
      <div id="lista"></div>

      <div class="nota" id="nota"></div>
    </div>
  </aside>
  <div id="mapa"></div>
</div>

const TIPOS = DADOS.tipos, FALLBACK = DADOS.fallback, SES = DADOS.subestacoes;

/* ------------------------------------------------------------------ *
 * formatacao
 * ------------------------------------------------------------------ */
const nf = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? "—"
  : v.toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d});
function energia(kwh){
  if(!kwh) return "—";
  if(kwh >= 1e6) return nf(kwh/1e6, 1) + " GWh";
  if(kwh >= 1e3) return nf(kwh/1e3, 1) + " MWh";
  return nf(kwh, 0) + " kWh";
}
function potkw(kw){
  if(!kw) return "—";
  return kw >= 1000 ? nf(kw/1000, 1) + " MW" : nf(kw, 0) + " kW";
}
function area(m2){
  if(!m2) return "—";
  return m2 >= 10000 ? nf(m2/10000, 2) + " ha" : nf(m2, 0) + " m²";
}
const dataBr = s => s ? s.split("-").reverse().join("/") : "—";
const tipoDe = s => TIPOS[s.pos] || FALLBACK;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ------------------------------------------------------------------ *
 * simbolos: cor (paleta Okabe-Ito, segura para daltonismo) + forma
 * ------------------------------------------------------------------ */
function formaSvg(forma, cor, r){
  const c = r, s = r * 0.92, borda = 1.6;
  const attr = `fill="${cor}" stroke="#101820" stroke-width="${borda}"`;
  let g;
  switch(forma){
    case "square":   g = `<rect x="${c-s*0.85}" y="${c-s*0.85}" width="${s*1.7}" height="${s*1.7}" rx="1.5" ${attr}/>`; break;
    case "triangle": g = `<polygon points="${c},${c-s} ${c+s*0.95},${c+s*0.75} ${c-s*0.95},${c+s*0.75}" ${attr}/>`; break;
    case "diamond":  g = `<polygon points="${c},${c-s} ${c+s},${c} ${c},${c+s} ${c-s},${c}" ${attr}/>`; break;
    case "hexagon":  g = `<polygon points="${pontosPoligono(c, s, 6, -Math.PI/2)}" ${attr}/>`; break;
    case "star":     g = `<polygon points="${pontosEstrela(c, s, s*0.46, 5)}" ${attr}/>`; break;
    default:         g = `<circle cx="${c}" cy="${c}" r="${s*0.92}" ${attr}/>`;
  }
  return `<svg width="${r*2}" height="${r*2}" viewBox="0 0 ${r*2} ${r*2}">${g}</svg>`;
}
function pontosPoligono(c, r, n, off){
  return Array.from({length:n}, (_,i)=>{
    const a = off + i*2*Math.PI/n;
    return `${(c+r*Math.cos(a)).toFixed(1)},${(c+r*Math.sin(a)).toFixed(1)}`;
  }).join(" ");
}
function pontosEstrela(c, R, r, n){
  const p = [];
  for(let i=0;i<n*2;i++){
    const raio = i%2 ? r : R, a = -Math.PI/2 + i*Math.PI/n;
    p.push(`${(c+raio*Math.cos(a)).toFixed(1)},${(c+raio*Math.sin(a)).toFixed(1)}`);
  }
  return p.join(" ");
}

const CORES_MIX = ["#0072B2","#E69F00","#009E73","#CC79A7","#56B4E9","#D55E00","#8B6F3E","#666666"];

function linhas(pares, simples){
  const html = pares.filter(p => p).map(([k,v,larga]) =>
    `<div class="k">${k}</div><div class="v${larga?" larga":""}">${v}</div>`).join("");
  return `<div class="grid${simples ? " simples" : ""}">${html}</div>`;
}
function secao(titulo, conteudo){
  return `<div class="sec"><div class="tit">${titulo}</div>${conteudo}</div>`;
}

function cabecalhoCartao(s){
  const t = tipoDe(s);
  return `<div class="cab">
      <div><div class="nome">${esc(s.nome)}</div>
      <div class="cod">${esc(s.cod)}${s.descr && s.descr !== s.nome ? " · " + esc(s.descr) : ""}</div></div>
      <div class="badge" style="border-color:${t.cor};color:${t.cor}">
        ${formaSvg(t.forma, t.cor, 6)} ${esc(s.pos || "?")}</div>
    </div>`;
}

function barraMix(s, comLegenda){
  const mix = Object.entries(s.mix || {})
    .filter(([k, v]) => k.trim() && v > 0).sort((a,b) => b[1]-a[1]);
  if(!mix.length) return "";
  const tot = mix.reduce((a,b) => a + b[1], 0);
  let h = `<div class="mix">` + mix.map(([k,v],i) =>
    `<i style="width:${(v/tot*100).toFixed(2)}%;background:${CORES_MIX[i%8]}"
        title="${esc(k)}"></i>`).join("") + `</div>`;
  if(comLegenda){
    h += `<div class="mixleg">` + mix.filter(([k,v]) => v/tot >= 0.005).map(([k,v],i) =>
      `<span style="--c:${CORES_MIX[i%8]}">${esc(k)} ${nf(v/tot*100,0)}%</span>`).join("") + `</div>`;
  }
  return h;
}

/* Cartao enxuto do hover: localizacao, tensao, energia, mercado e carga. */
function cartaoResumo(s){
  const t = tipoDe(s);
  const ucTotal = s.uc_bt + s.uc_mt + s.uc_at;
  const ucAtiva = s.uc_bt_ativa + s.uc_mt_ativa + s.uc_at_ativa;
  const tensoes = [...new Set([...(s.ten_pri || []), ...(s.ten_bar_at || [])])];
  const tensoesMt = [...new Set([...(s.ten_sec || []), ...(s.ten_alim || [])])];

  let h = cabecalhoCartao(s) + `<div class="corpo">`;

  h += secao("Localização", linhas([
    ["Município", `${esc(s.mun || "—")}${s.uf ? " / " + esc(s.uf) : ""}${s.mun_aprox ? " *" : ""}`],
    ["Mesorregião", esc(s.meso || "—")],
    ["Conjunto", esc(s.conj_nome || "—")],
    ["Coordenadas", `${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}`]
  ], true));

  h += secao("Tensão e energia", linhas([
    ["Tensão AT", esc(tensoes.join(" · ") || "—")],
    ["Tensão MT", esc(tensoesMt.join(" · ") || "—")],
    s.pot_mva ? ["Transformação", nf(s.pot_mva, 1) + " MVA"] : null,
    s.ene_alim ? ["Energia/ano", energia(s.ene_alim)] : null
  ], true));

  h += secao("Mercado atendido", ucTotal ? linhas([
    ["UCs atendidas", `${nf(ucTotal)} (${nf(ucAtiva)} ativas)`],
    ["Consumo/ano", energia(s.ene_uc)]
  ], true) : `<div class="vazio">Sem unidade consumidora vinculada.</div>`);

  const mix = barraMix(s, true);
  if(mix) h += secao("Distribuição da carga", mix);

  h += `</div><div class="rodape">${esc(t.label)} · clique para a ficha completa</div>`;
  return `<div class="card enxuto">${h}</div>`;
}

function cartao(s, completo){
  if(!completo) return cartaoResumo(s);
  const t = tipoDe(s);
  const trafos = s.trafos || [], alim = s.alim || [];
  const ucTotal = s.uc_bt + s.uc_mt + s.uc_at;
  const ucAtiva = s.uc_bt_ativa + s.uc_mt_ativa + s.uc_at_ativa;

  let h = cabecalhoCartao(s) + `<div class="corpo">`;

  h += secao("Localização", linhas([
    ["Município", `${esc(s.mun || "—")}${s.uf ? " / " + esc(s.uf) : ""}` +
      `${s.mun_cod ? ` <span style="color:#8492a4;font-weight:400">(${esc(s.mun_cod)})</span>` : ""}` +
      `${s.mun_aprox ? " *" : ""}`, true],
    ["Mesorregião", esc(s.meso || "—"), true],
    ["Microrregião", esc(s.micro || "—"), true],
    ["Conjunto", s.conj_nome ? `${esc(s.conj_nome)} (${esc(s.conj_cod)})` : "—", true],
    ["Coordenadas", `${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}`],
    ["Área do pátio", area(s.area)],
    ["Localização", esc(s.are_loc || "—")],
    ["Sist. interlig.", s.sist_int ? "Sim" : "Não"]
  ]));

  h += secao("Transformação (alta tensão)", s.n_trafo ? linhas([
    ["Transf. de força", `${nf(s.n_trafo)} (${nf(s.n_trafo_ativo)} ativos)`],
    ["Potência nominal", nf(s.pot_mva, 1) + " MVA"],
    ["Capac. máxima", s.pot_max_mva ? nf(s.pot_max_mva, 1) + " MVA" : "—"],
    ["Tensão primária", esc((s.ten_pri || []).join(" · ") || "—")],
    ["Tensão secund.", esc((s.ten_sec || []).join(" · ") || "—")],
    ["Barramentos", s.n_bar ? nf(s.n_bar) : "—"],
    ["Manobra AT", s.n_manobra ? nf(s.n_manobra) : "—"],
    ["Energização", s.dat_min === s.dat_max ? dataBr(s.dat_min)
        : `${dataBr(s.dat_min)} – ${dataBr(s.dat_max)}`, true],
    s.ten_bar_at && s.ten_bar_at.length ? ["Barras AT", esc(s.ten_bar_at.join(" · ")), true] : null,
    s.ten_bar_mt && s.ten_bar_mt.length ? ["Barras MT", esc(s.ten_bar_mt.join(" · ")), true] : null
  ]) : `<div class="vazio">Sem transformador de força registrado na BDGD
        (ponto de conexão, derivação ou entrada de cliente).</div>`);

  if(trafos.length){
    const lim = completo ? trafos.length : 2;
    h += `<table class="tab"><tr><th>Transformador</th><th class="n">MVA</th>
      <th>Relação</th><th>Situação</th></tr>` +
      trafos.slice(0, lim).map(x => `<tr><td>${esc(x.cod)}</td><td class="n">${nf(x.pot,1)}</td>
        <td>${esc(x.tp)}${x.ts ? " / " + esc(x.ts) : ""}</td>
        <td>${x.sit === "AT" ? "ativo" : esc(x.sit || "—")}</td></tr>`).join("") +
      (trafos.length > lim ? `<tr><td colspan="4">+ ${trafos.length - lim} transformador(es)</td></tr>` : "") +
      `</table>`;
  }

  h += secao("Distribuição (média tensão)", s.n_alim ? linhas([
    ["Alimentadores", nf(s.n_alim)],
    ["Tensões", esc((s.ten_alim || []).join(" · ") || "—")],
    ["Energia/ano", energia(s.ene_alim)],
    ["Transf. de distrib.", nf(s.n_trafo_dist)],
    ["Potência MT/BT", s.pot_dist_kva ? nf(s.pot_dist_kva/1000, 1) + " MVA" : "—"],
    ["Municípios atend.", nf(s.n_mun)]
  ]) : `<div class="vazio">Nenhum alimentador de MT parte desta subestação.</div>`);

  if(alim.length){
    const lim = completo ? alim.length : 3;
    h += `<table class="tab"><tr><th>Alimentador</th><th>kV</th><th class="n">Energia/ano</th></tr>` +
      alim.slice(0, lim).map(a => `<tr><td>${esc(a.nome)}</td><td>${esc(a.ten)}</td>
        <td class="n">${energia(a.ene)}</td></tr>`).join("") +
      (alim.length > lim ? `<tr><td colspan="3">+ ${alim.length - lim} alimentador(es)</td></tr>` : "") +
      `</table>`;
  }

  h += secao("Mercado atendido", ucTotal ? linhas([
    ["UCs totais", `${nf(ucTotal)} (${nf(ucAtiva)} ativas)`],
    ["Consumo/ano", energia(s.ene_uc)],
    ["UC baixa tensão", nf(s.uc_bt)],
    ["UC média tensão", nf(s.uc_mt)],
    ["UC alta tensão", nf(s.uc_at)],
    ["Demanda contrat.", potkw(s.dem_cont)],
    ["Carga inst. declarada", potkw(s.car_inst), true]
  ]) : `<div class="vazio">Sem unidade consumidora vinculada.</div>`);

  h += barraMix(s, true);

  if(s.ug){
    h += secao("Geração distribuída", linhas([
      ["Unidades (GD)", nf(s.ug)],
      ["Energia injetada", energia(s.ug_ene)],
      ["Pot. declarada", potkw(s.ug_pot), true],
      s.ug_suspeito ? ["⚠ Inconsistência",
        `${nf(s.ug_suspeito)} registro(s) com potência acima do teto legal de 5 MW —
         a potência declarada da BDGD está inflada aqui`, true] : null
    ]));
  }

  h += `</div><div class="rodape">${esc(t.label)} · código POS <b>${esc(s.pos || "?")}</b>` +
       (s.mun_fonte ? " · município: " + esc(s.mun_fonte) : "") + `</div>`;
  return `<div class="card">${h}</div>`;
}

const bases = {

const potMax = Math.max(...SES.map(s => s.pot_mva || 0), 1);
const camada = L.layerGroup().addTo(mapa);
const estado = {tipos:new Set(Object.keys(TIPOS).concat([""])), busca:"", municipio:"",

SES.forEach(s => {
  s._t = tipoDe(s);
  s._chave = (s.nome + " " + s.cod + " " + s.mun + " " + s.conj_nome + " " + s.descr).toLowerCase();
});

function raio(s){
  if(!estado.tamanho) return 9;
  const p = s.pot_mva || 0;
  return 7.5 + 11.5 * Math.sqrt(p / potMax);
}
function criaMarcador(s){
  const r = raio(s);
  const icone = L.divIcon({
    className: "marcador",
    html: formaSvg(s._t.forma, s._t.cor, r),
    iconSize: [r*2, r*2], iconAnchor: [r, r]
  });
  const m = L.marker([s.lat, s.lon], {icon:icone, riseOnHover:true,
    zIndexOffset: Math.round(s.pot_mva || 0)});
  m.bindTooltip(() => cartao(s, false), {className:"card", direction:"auto", offset:[0, 0], opacity:1, sticky:false});
  m.on("click", () => mostraDetalhe(s));
  s._m = m;
  return m;
}

function visiveis(){
  return SES.filter(s => estado.tipos.has(s.pos || "") &&
    (!estado.municipio || s.mun === estado.municipio) &&
    (!estado.busca || s._chave.includes(estado.busca)));
}

function criaRotulo(s){
  const r = raio(s);
  return L.marker([s.lat, s.lon], {
    interactive: false, keyboard: false,
    icon: L.divIcon({className:"rotulo", html:esc(s.nome),
      iconSize:[0,0], iconAnchor:[-r-2, 7]})
  });
}

function desenha(){
  camada.clearLayers();
  const lista = visiveis();
  lista.forEach(s => camada.addLayer(criaMarcador(s)));
  if(estado.rotulo) lista.forEach(s => camada.addLayer(criaRotulo(s)));
  atualizaKpis(lista);
  atualizaLista(lista);
}

/* ------------------------------------------------------------------ *
 * painel
 * ------------------------------------------------------------------ */
document.getElementById("cabecalho").innerHTML =
  `${DADOS.meta.total} subestações · ${esc(DADOS.meta.fonte)} · base ${DADOS.meta.data_base}`;

function atualizaKpis(lista){
  const soma = (f) => lista.reduce((a, s) => a + (f(s) || 0), 0);
  const kpis = [
    [nf(lista.length), "subestações"],
    [nf(soma(s => s.pot_mva), 0) + " MVA", "transformação"],
    [nf(soma(s => s.n_alim)), "alimentadores"],
    [energia(soma(s => s.ene_uc)), "consumo/ano"],
    [nf(soma(s => s.uc_bt + s.uc_mt + s.uc_at)), "unidades consum."],
    [nf(soma(s => s.ug)), "unidades de GD"]
  ];
  document.getElementById("kpis").innerHTML = kpis.map(([v,k]) =>
    `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join("");
}

function atualizaLista(lista){
  const ord = [...lista].sort((a,b) => (b.pot_mva - a.pot_mva) || a.nome.localeCompare(b.nome));
  const max = 250;
  document.getElementById("tituloLista").textContent =
    `Subestações (${lista.length}${lista.length > max ? " · exibindo " + max : ""})`;
  document.getElementById("lista").innerHTML = ord.slice(0, max).map((s,i) =>
    `<div class="item" data-cod="${esc(s.cod)}">
       ${formaSvg(s._t.forma, s._t.cor, 7)}
       <span class="nm">${esc(s.nome)}</span>
       <span class="vl">${s.pot_mva ? nf(s.pot_mva,1) + " MVA" : "—"}</span>
     </div>`).join("");
  document.querySelectorAll("#lista .item").forEach(el => {
    el.onclick = () => {
      const s = SES.find(x => x.cod === el.dataset.cod);
      mapa.flyTo([s.lat, s.lon], 13, {duration:.7});
      if(s._m) s._m.openTooltip();
      mostraDetalhe(s);
    };
  });
}

function mostraDetalhe(s){
  let box = document.getElementById("detalhe");
  if(!box){
    box = document.createElement("div");
    box.id = "detalhe";
    document.querySelector(".rolagem").prepend(box);
  }
  box.innerHTML = `<h2>Detalhe <span id="fechar">fechar ✕</span></h2>` + cartao(s, true);
  document.getElementById("fechar").onclick = () => box.remove();
  document.querySelector(".rolagem").scrollTop = 0;
}

const contagem = {};
SES.forEach(s => contagem[s.pos || ""] = (contagem[s.pos || ""] || 0) + 1);
const ordemTipos = Object.keys(TIPOS).filter(k => contagem[k])
  .concat(contagem[""] ? [""] : []);
document.getElementById("legenda").innerHTML = ordemTipos.map(k => {
  const t = TIPOS[k] || FALLBACK;
  return `<div class="tipo" data-pos="${k}">${formaSvg(t.forma, t.cor, 9)}
    <span>${esc(t.label)}</span><span class="qtd">${contagem[k]}</span></div>`;
}).join("");
document.querySelectorAll(".tipo").forEach(el => {
  el.onclick = () => {
    const p = el.dataset.pos;
    if(estado.tipos.has(p)){ estado.tipos.delete(p); el.classList.add("off"); }
    else { estado.tipos.add(p); el.classList.remove("off"); }
    desenha();
  };
});

const porMunicipio = {};
SES.forEach(s => { if(s.mun) porMunicipio[s.mun] = (porMunicipio[s.mun] || 0) + 1; });
document.getElementById("filtroMun").innerHTML =
  `<option value="">Todos os municípios (${Object.keys(porMunicipio).length})</option>` +
  Object.keys(porMunicipio).sort((a,b) => a.localeCompare(b, "pt-BR")).map(m =>
    `<option value="${esc(m)}">${esc(m)} (${porMunicipio[m]})</option>`).join("");
document.getElementById("filtroMun").onchange = (e) => {
  estado.municipio = e.target.value;
  desenha();
  const lista = visiveis();
  if(lista.length) mapa.flyToBounds(L.latLngBounds(lista.map(s => [s.lat, s.lon])),
    {padding:[60,60], maxZoom:12, duration:.7});
};

document.getElementById("busca").oninput = (e) => {
  estado.busca = e.target.value.trim().toLowerCase();
  desenha();
};
document.getElementById("opt-tamanho").onchange = (e) => {
  estado.tamanho = e.target.checked; desenha();
};
document.getElementById("opt-rotulo").onchange = (e) => {
  estado.rotulo = e.target.checked; desenha();
};

document.getElementById("nota").innerHTML = `
  <b>Como ler o mapa.</b> Cada tipo tem cor <i>e</i> forma próprias — a paleta é a
  Okabe-Ito, legível para protanopia, deuteranopia e tritanopia, e as formas garantem
  a leitura mesmo em escala de cinza ou impressão P&amp;B.
  O tamanho do símbolo é proporcional à raiz da potência instalada de transformação.<br><br>
  <b>Tipo</b> = campo <code>POS</code> (posse/propriedade) da BDGD; os rótulos foram
  inferidos a partir dos nomes das subestações de cada grupo, pois o domínio não vem
  descrito no arquivo.<br><br>
  <b>Município</b> vem da malha de subdistritos do IBGE 2022 (ponto dentro do polígono);
  para as subestações de fronteira, fora da Bahia, usa-se o município declarado nos ativos
  da BDGD ou a sede mais próxima (marcada com *).<br><br>
  <b>Ressalva de qualidade.</b> O campo <code>POT_INST</code> das unidades geradoras
  tem inconsistência de unidade na base: 4.266 registros de BT/MT declaram potência
  acima do teto legal de 5 MW da micro/minigeração. A contagem de unidades e a energia
  injetada são confiáveis; a potência declarada é sinalizada quando afetada.<br><br>
  <b>Cobertura.</b> Universo = subestações da BDGD da Neoenergia Coelba (concessionária
  de ~99% dos municípios baianos). Não inclui subestações exclusivamente de transmissão
  que não constam da base da distribuidora.`;

desenha();
mapa.fitBounds(L.latLngBounds(SES.map(s => [s.lat, s.lon])), {padding:[24,24]});
</script>
